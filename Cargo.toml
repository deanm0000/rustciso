[package]
name = "rustciso"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
base64 = "0.22"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
datafusion = "55"
futures = "0.3.34"
hmac = "0.12"
httpdate = "1.0.3"
object_store = { version = "0.13", features = ["azure"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tokio-postgres-rustls = "0.13"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v7"] }
webpki-roots = "1"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
async-trait = "0.1"
